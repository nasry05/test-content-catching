<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>AADK-VR</title>
    <meta name="description" content="">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="app-container">
      <div id="app-canvas-container">
        <canvas id="app-canvas"></canvas>
      </div>
      <div id="app-loading">
        <div id="app-progress-empty">
          <div id="app-progress-full"></div>
        </div>
      </div>
      <div id="app-footer">
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/testEnhancement.loader.js";
      var config = {
        dataUrl: buildUrl + "/testEnhancement.data",
        frameworkUrl: buildUrl + "/testEnhancement.framework.js",
        codeUrl: buildUrl + "/testEnhancement.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "AADK-VR",
        productVersion: "0.1.0",
      };

      var canvas = document.querySelector("#app-canvas");
      var loadingBar = document.querySelector("#app-loading");
      var progressBarFull = document.querySelector("#app-progress-full");
      var unityInstance = null;
      

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);
    </script>
  </body>
</html>
